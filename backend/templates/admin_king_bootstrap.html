<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <header class="top">
    <h1>长寿之王 · 创建默认版本</h1>
    <p class="hint">默认版本创建后不可删除，名称与封面可再改。封面必填。</p>
    <p><a class="back-link" href="/admin/">← 返回首页</a></p>
  </header>
  <main>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/king" enctype="multipart/form-data" class="form">
      <label>版本名称
        <input type="text" name="name" required maxlength="200" value="{{ name }}" />
      </label>
      <label>封面
        <input type="file" name="cover" accept="image/*" required />
      </label>
      <p class="hint">支持 jpg/png/webp/gif；上限 20MB</p>
      <button type="submit">创建默认版本</button>
    </form>
  </main>
</body>
</html>
