<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <header class="top">
    <h1>{{ title }}</h1>
    <p class="hint">用户 #{{ user.id }} · {{ user.nickname }}</p>
    <p class="hint"><a class="back-link" href="/admin/users?page={{ page }}">← 返回用户列表</a></p>
  </header>
  <main>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ action }}" class="form">
      <input type="hidden" name="page" value="{{ page }}" />
      <label>新密码
        <input type="password" name="password" required minlength="4" maxlength="128"
               autocomplete="new-password" />
      </label>
      <label>确认新密码
        <input type="password" name="password_confirm" required minlength="4" maxlength="128"
               autocomplete="new-password" />
      </label>
      <p class="hint">密码长度 4～128 个字符；与注册规则一致。</p>
      <button type="submit">保存密码</button>
    </form>
  </main>
</body>
</html>
