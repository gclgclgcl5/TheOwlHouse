<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <header class="top">
    <h1>追加新页 · {{ version.name }}</h1>
    <p class="hint">将创建全局第 {{ next_no }} 页，标题全版本共享。</p>
    <p><a class="back-link" href="/admin/king/versions/{{ version.id }}">← 返回版本</a></p>
  </header>
  <main>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/king/versions/{{ version.id }}/pages/new" enctype="multipart/form-data" class="form">
      <label>标题
        <input type="text" name="title" required maxlength="200" value="{{ title_value }}" />
      </label>
      <label>图片
        <input type="file" name="image" accept="image/*" required />
      </label>
      <p class="hint">支持 jpg/png/webp/gif；单张上限 20MB</p>
      <button type="submit">保存</button>
    </form>
  </main>
</body>
</html>
