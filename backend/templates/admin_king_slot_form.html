<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <header class="top">
    <h1>{{ title }} · {{ version.name }}</h1>
    <p class="hint">页序 {{ slot.page_no }}（不可修改）。改标题会影响所有版本的同一页。</p>
    <p><a class="back-link" href="/admin/king/versions/{{ version.id }}">← 返回版本</a></p>
  </header>
  <main>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/king/versions/{{ version.id }}/slots/{{ slot.id }}" enctype="multipart/form-data" class="form">
      <label>标题
        <input type="text" name="title" required maxlength="200" value="{{ slot.title }}" />
      </label>
      <label>图片{% if image_url %}（可选，不选则保留原图）{% else %}（待上传，必填）{% endif %}
        <input type="file" name="image" accept="image/*" {% if not image_url %}required{% endif %} />
      </label>
      <p class="hint">支持 jpg/png/webp/gif；单张上限 20MB。只能替换图片，不能删除。</p>
      {% if image_url %}
      <p><img class="preview" src="{{ image_url }}" alt="当前图片" /></p>
      {% endif %}
      <button type="submit">保存</button>
    </form>
  </main>
</body>
</html>
